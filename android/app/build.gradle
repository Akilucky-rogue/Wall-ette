apply plugin: 'com.android.application'

// Release signing. The APK for the website download is signed with the key
// in android/key.properties. Google Play builds (bundleRelease -Pplay, which
// npm run android:bundle runs) use the upload key in android/upload.properties:
// the old key was in a pull request, so Play gets a new one (audit C2). Both
// files are gitignored; copy the .example next to each and fill it in.
def forPlay = project.hasProperty('play')
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file(forPlay ? "upload.properties" : "key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.wallette.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.wallette.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 13
        versionName "1.5.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            // Keep minify off: all app logic is JS in the WebView, so R8 gains
            // nothing and risks breaking the Capacitor bridge.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            // Crash reports on (Profile can turn them off; services/crashReports.ts).
            manifestPlaceholders = [crashlyticsCollection: "true"]
        }
        debug {
            // Debug builds never send crash reports.
            manifestPlaceholders = [crashlyticsCollection: "false"]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Checked after android {} so the build stops with this message alone.
if (forPlay && !keystorePropertiesFile.exists()) {
    throw new GradleException("android/upload.properties is missing: create the upload key first (docs/PLAY_SUBMISSION.md, step 1).")
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // MainActivity turns on edge to edge (EdgeToEdge); same version as Capacitor.
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // MainActivity reports a lost WebView renderer; same version as the plugin.
    implementation "com.google.firebase:firebase-crashlytics:$firebaseCrashlyticsVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Native Firebase, for Crashlytics. google-services.json is gitignored like
// the signing files; without it crash reporting would fail at runtime, so the
// build stops instead (docs/PLAY_SUBMISSION.md, step 1).
if (!file('google-services.json').exists()) {
    throw new GradleException("android/app/google-services.json is missing. Download it with: npx firebase-tools apps:sdkconfig ANDROID 1:881370415293:android:b9d1da6f023d700e1877d4 --project wall-e-7a113 --out android/app/google-services.json")
}
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
