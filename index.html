<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Wall-ette: your bank statement, made readable</title>
    <meta name="description" content="Import your bank statement and see your spending, income and transfers clearly. The file is read on your phone, with no ads and no AI services." />
    <link rel="canonical" href="https://wall-ette.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wall-ette" />
    <meta property="og:title" content="Wall-ette: your bank statement, made readable" />
    <meta property="og:description" content="Import your bank statement and see your spending, income and transfers clearly. Private, with no ads." />
    <meta property="og:url" content="https://wall-ette.com/" />
    <meta property="og:image" content="https://wall-ette.com/og-image.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="500" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Icons: Material Symbols from Google Fonts (axis narrowed to the
         weights used: wght 200, FILL 0..1). The stylesheet no longer holds up
         the first paint: on a slow or captive network the app stayed white
         until the request gave up. Icons stay hidden until their font is
         ready, so their names never flash as text; if it can't load, they
         show as text. Inter and Manrope come with the app (index.tsx). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
        function walletteIcons(loaded) {
            var ready = function () { document.documentElement.classList.add('icons-ready'); };
            if (loaded && document.fonts) document.fonts.load("24px 'Material Symbols Outlined'").then(ready, ready);
            else ready();
        }
        setTimeout(function () { document.documentElement.classList.add('icons-ready'); }, 8000);
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@200,0..1&display=block" rel="stylesheet" media="print" onload="this.media='all'; walletteIcons(true)" onerror="walletteIcons(false)" />
    <style>
        /* System bar insets (audit H6). The Android app draws edge to edge
           on every version; Capacitor's SystemBars sets --safe-area-inset-*
           there, iOS gives env(), and both are 0 where nothing overlaps. Use --sat and
           --sab for anything fixed to the top or bottom of the screen. Side
           insets (the 3-button bar in landscape) land in the margins around
           every screen's 430px column, so nothing pads for them. */
        :root {
            --sat: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
            --sab: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
        }
        body {
            /* Shows behind the status and navigation bars, so it follows the
               theme (theme.ts sets --c-bg). */
            background-color: rgb(var(--c-bg, 249 243 237));
            min-height: 100vh;
            padding-top: var(--sat);
            padding-bottom: var(--sab);
        }
        /* Strips of background under the status bar and the navigation bar,
           so content scrolling past never shows behind the clock, icons or
           buttons (styles.xml turns off Android's own nav bar scrim). Above
           page headers (z-30/40) and the bottom bar (z-40); backdrops (z-50
           and up) dim them. The bottom one is 0 high while the keyboard is up. */
        body::before,
        body::after {
            content: '';
            position: fixed;
            left: 0;
            right: 0;
            background-color: rgb(var(--c-bg, 249 243 237));
            z-index: 45;
            pointer-events: none;
        }
        body::before {
            top: 0;
            height: var(--sat);
        }
        body::after {
            bottom: 0;
            height: var(--sab);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
        }
        html:not(.icons-ready) .material-symbols-outlined {
            visibility: hidden;
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none;    /* Firefox */
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
